<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>California House Price Prediction</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="header">

                <h1>🏠 California House Price</h1>

                <p>
                    Machine Learning Prediction System
                </p>

            </div>


            <form action="/predict" method="POST">

                <div class="form-grid">

                    {% for column in columns %}

                    <div class="input-group">

                        <label for="{{ column }}">
                            {{ column }}
                        </label>

                        <input
                            type="number"
                            step="any"
                            id="{{ column }}"
                            name="{{ column }}"
                            placeholder="Enter {{ column }}"
                            required
                        >

                    </div>

                    {% endfor %}

                </div>


                <button type="submit">
                    Predict House Value
                </button>

            </form>


            {% if prediction is defined %}

            <div class="result">

                <h2>Prediction Result</h2>

                <div class="price">
                    ${{ "%.2f"|format(prediction) }}
                </div>

                <p>
                    Estimated Median House Value
                </p>

            </div>

            {% endif %}

        </div>

    </div>

</body>

</html>
